<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- HerdrM D: minimal TUI status rows + prompt.
       Full-bleed square artwork; the OS applies the application icon mask.
       Layers for Icon Composer: #background, #sidebar, #glyph. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#292A2F"/>
      <stop offset="1" stop-color="#111216"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36373E"/>
      <stop offset="1" stop-color="#23242B"/>
    </linearGradient>
    <linearGradient id="status" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#787A84"/>
      <stop offset="1" stop-color="#5D5F69"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0F1F4"/>
      <stop offset="1" stop-color="#D9DAE1"/>
    </linearGradient>
  </defs>

  <g id="background">
    <rect width="1024" height="1024" fill="url(#bg)"/>
  </g>

  <g id="sidebar">
    <rect width="312" height="1024" fill="url(#side)"/>
    <rect x="311" width="3" height="1024" fill="#000000" opacity="0.45"/>
    <!-- Three compact status rows retain the original multi-Agent identity. -->
    <rect x="50" y="244" width="165" height="58" rx="17" fill="url(#status)"/>
    <rect x="50" y="426" width="145" height="58" rx="17" fill="url(#status)"/>
    <rect x="50" y="608" width="120" height="58" rx="17" fill="url(#status)"/>
    <rect x="238" y="244" width="58" height="58" rx="17" fill="#00F008"/>
    <rect x="238" y="426" width="58" height="58" rx="17" fill="#00F008"/>
    <rect x="238" y="608" width="58" height="58" rx="17" fill="#00F008"/>
  </g>

  <g id="glyph">
    <path d="M 450 276 L 662 494 L 450 712"
          fill="none" stroke="#00F008" stroke-width="100"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="720" y="650" width="204" height="116" rx="25" fill="url(#cursor)"/>
  </g>
</svg>
