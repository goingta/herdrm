name: HerdrM
options:
  bundleIdPrefix: dev.bybee
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  developmentRegion: en
  knownRegions:
    - en
    - zh-Hans
packages:
  HerdrKit:
    path: Packages/HerdrKit
  HerdrSSH:
    path: Packages/HerdrSSH
  HerdrTailcat:
    path: Packages/HerdrTailcat
  GhosttyTerminal:
    url: https://github.com/Lakr233/libghostty-spm
    # Prebuilt libghostty xcframework — pin exactly and review the checksum diff
    # on every bump (supply-chain discipline for a binary dependency). The
    # version scheme is <major.minor>.<UTC yyyymmdd>, so `from:` would drift.
    exactVersion: "1.6.20260909"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.6"
  StickySectionHeaders:
    # Sidebar section headers (pin + cover + scroll-linked fade). Pinned to a
    # release tag; bump deliberately.
    url: https://github.com/jt-wang/StickySectionHeaders
    exactVersion: "1.0.0"
targets:
  HerdrM:
    type: application
    platform: macOS
    sources:
      - Sources/HerdrM
      - Sources/HerdrShared
      - path: Resources
        buildPhase: resources
        excludes:
          - Localizable.xcstrings
          - AppIcon/MobileAssets.xcassets
          - AppIcon/generate-mobile-icon.swift
          - AppIcon/README.md
          - BrandIcons.xcassets
          - generate-brand-icons.swift
      - path: Resources/Localizable.xcstrings
    dependencies:
      - package: HerdrKit
      - package: HerdrTailcat
        product: HerdrTailcat
      - package: GhosttyTerminal
        product: GhosttyTerminal
      - package: Sparkle
      - package: StickySectionHeaders
    info:
      path: Sources/HerdrM/Info.plist
      properties:
        CFBundleName: herdrm
        CFBundleDisplayName: herdrm
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 MOE AI LLC"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
        SUFeedURL: https://github.com/missuo/herdrm/releases/latest/download/appcast.xml
        SUPublicEDKey: RHEhllstUuuVrVDCPGrbhg/8LivSzpuZB9X3u3xdV5o=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.herdrm
        PRODUCT_NAME: herdrm
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: NCFNX3LJ83
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Debug:
          # real identity so UserNotifications & friends work in dev builds
          CODE_SIGN_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"
          ONLY_ACTIVE_ARCH: YES
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "arm64 x86_64"

  HerdrMobile:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources/HerdrMobile
      - Sources/HerdrShared
      - path: Resources/Localizable.xcstrings
      - path: Resources/AppIcon/MobileAssets.xcassets
        buildPhase: resources
      - path: Resources/BrandIcons.xcassets
        buildPhase: resources
      - path: Resources/ChatPresentation
        type: folder
        buildPhase: resources
    dependencies:
      - package: HerdrKit
      - package: HerdrSSH
      - package: HerdrTailcat
        product: HerdrTailcat
      - package: GhosttyTerminal
        product: GhosttyTerminal
    info:
      path: Sources/HerdrMobile/Info.plist
      properties:
        CFBundleName: herdrm
        CFBundleDisplayName: herdrm
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
        NSLocalNetworkUsageDescription: >-
          herdrm connects to your development machines over SSH on your local network
          to reach the herdr sessions running on them.
        # Development pages may use HTTP. This exception applies to WKWebView
        # content only; HTTPS retains normal WebKit certificate verification.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.herdrm.ios
        PRODUCT_NAME: HerdrMobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NCFNX3LJ83
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # The bundled libssh2/OpenSSL xcframeworks ship arm64 device + arm64
        # simulator slices only (see Packages/HerdrSSH/Artifacts/PROVENANCE.md).
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        EXCLUDED_ARCHS__sdk_iphonesimulator__: x86_64
  HerdrMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Tests/HerdrMobileTests
      - Tests/HerdrSharedTests
    dependencies:
      - target: HerdrMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.herdrm.ios.tests
        SWIFT_VERSION: "5.10"
        ARCHS: arm64
        EXCLUDED_ARCHS__sdk_iphonesimulator__: x86_64

  HerdrMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Tests/HerdrMobileUITests
    dependencies:
      - target: HerdrMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.herdrm.ios.uitests
        TEST_TARGET_NAME: HerdrMobile
        SWIFT_VERSION: "5.10"
        ARCHS: arm64
        EXCLUDED_ARCHS__sdk_iphonesimulator__: x86_64

  HerdrNavigationHarness:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/HerdrMobile
        excludes: [HerdrMobileApp.swift, Info.plist]
      - Sources/HerdrShared
      - Tests/HerdrNavigationHarness
      - path: Tests/VisualAcceptance/VisualFixture.swift
      - path: Tests/VisualAcceptance/VisualChatHTTPBoundary.swift
      - path: Tests/VisualAcceptance/scene.json
        buildPhase: resources
      - path: Resources/BrandIcons.xcassets
        buildPhase: resources
      - path: Resources/ChatPresentation
        type: folder
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
      - path: Resources/AppIcon/MobileAssets.xcassets
        buildPhase: resources
    info:
      path: Tests/HerdrNavigationHarness/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: HerdrKit
      - package: HerdrSSH
      - package: HerdrTailcat
      - package: GhosttyTerminal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.herdrm.navigation-fixture
        PRODUCT_NAME: NavigationHarness
        INFOPLIST_KEY_CFBundleDisplayName: Herdr UI Fixture
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: arm64
        EXCLUDED_ARCHS__sdk_iphonesimulator__: x86_64
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  HerdrNavigationUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources: [Tests/HerdrNavigationUITests]
    dependencies:
      - target: HerdrNavigationHarness
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.herdrm.navigation-uitests
        TEST_TARGET_NAME: HerdrNavigationHarness
        SWIFT_VERSION: "5.10"
        ARCHS: arm64
        EXCLUDED_ARCHS__sdk_iphonesimulator__: x86_64
  HerdrMTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HerdrMTests
      - Tests/HerdrSharedTests
    dependencies:
      - target: HerdrM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.herdrm.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.10"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/herdrm.app/Contents/MacOS/herdrm"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"

  HerdrMacVisualHarness:
    type: application
    platform: macOS
    sources:
      - path: Sources/HerdrM
        excludes: [Info.plist]
      - Sources/HerdrShared
      - Tests/HerdrMacVisualHarness
      - path: Tests/VisualAcceptance/VisualFixture.swift
      - path: Tests/VisualAcceptance/VisualChatHTTPBoundary.swift
      - path: Tests/VisualAcceptance/scene.json
        buildPhase: resources
      - path: Resources
        buildPhase: resources
        excludes: [Localizable.xcstrings, AppIcon/MobileAssets.xcassets, BrandIcons.xcassets, generate-brand-icons.swift, AppIcon/generate-mobile-icon.swift, AppIcon/README.md]
      - path: Resources/Localizable.xcstrings
    dependencies:
      - package: HerdrKit
      - package: HerdrTailcat
      - package: GhosttyTerminal
      - package: Sparkle
      - package: StickySectionHeaders
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.herdrm.mac-visual-fixture
        PRODUCT_NAME: MacVisualHarness
        SWIFT_VERSION: "5.10"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) VISUAL_ACCEPTANCE_HOST"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO

  HerdrMacVisualUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/HerdrMacVisualUITests]
    dependencies:
      - target: HerdrMacVisualHarness
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.herdrm.mac-visual-uitests
        TEST_TARGET_NAME: HerdrMacVisualHarness
        SWIFT_VERSION: "5.10"
        CODE_SIGN_IDENTITY: "-"

schemes:
  HerdrMacVisualAcceptance:
    build:
      targets:
        HerdrMacVisualHarness: all
        HerdrMacVisualUITests: [test]
    test:
      targets: [HerdrMacVisualUITests]
  HerdrNavigationAcceptance:
    build:
      targets:
        HerdrNavigationHarness: all
        HerdrNavigationUITests: [test]
    test:
      config: Debug
      targets: [HerdrNavigationUITests]
  HerdrMobile:
    build:
      targets:
        HerdrMobile: all
        HerdrMobileTests: [test]
    test:
      config: Debug
      targets:
        - HerdrMobileTests
  HerdrMobileUIAcceptance:
    build:
      targets:
        HerdrMobile: all
        HerdrMobileUITests: [test]
    test:
      config: Debug
      targets:
        - HerdrMobileUITests
  HerdrM:
    build:
      targets:
        HerdrM: all
        HerdrMTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HerdrMTests
